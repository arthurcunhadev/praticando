<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="imagens/capa.png" alt="capa da pokédex">
        <nav>
            <ul>
                <li><a href="https://www.poke-blast-news.net/p/pokedex.html#kanto">Kanto</a></li>
                <li><a href="https://www.poke-blast-news.net/p/pokedex.html#johto">Johto</a></li>
                <li><a href="https://www.poke-blast-news.net/p/pokedex.html#hoenn">Hoenn</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>1 geração kanto</h1>
        <div>
            <div class="quadrado">
                <img class="img-pokemon" src="imagens/bulbasaur.png" alt="bulbasaur">
                <p>#001</p>
                <p>Bulbasaur</p>
            </div>
            <div class="quadrado">
                <img class="img-pokemon" src="imagens/ivysaur.png" alt="ivysaur">
                <p>#002</p>
                <p>Ivysaur</p>
            </div>
            <div class="quadrado">
                <img class="img-pokemon" src="imagens/venusaur.png" alt="venusaur">
                <p>#003</p>
                <p>Venusaur</p>
            </div>
        </div>
    </main>

    <footer>
        <img src="imagens/logo-pokedex.png" alt="logo pokédex">
        <p>Produzindo conteúdo de qualidade para os fãs de Pokémon desde 2010, é um dos maiores sites em língua portuguesa sobre a franquia Pokémon!</p>
    </footer>
</body>
</html>
